openapi: 3.1.0
info:
  title: Family Step Leaderboard API
  version: 0.3.0
  description: |
    The frontend, the scheduler and the MCP server all talk to the backend only
    through this API. Days are calendar dates in Eastern time (America/New_York);
    a day ends at midnight Eastern.

    A family's invite code is its password. Every request about a family (its
    members, steps, boards and messages) sends that family's code in the
    `X-Family-Code` header (security scheme `FamilyCode`). Only checking the
    backend's health, creating a family and joining one work without it. The
    Demo Family's code is `DEMO`, and it's public on purpose.

    The checks go in this order: no code at all is `401`; then a family or member
    that doesn't exist is `404`; then a code that isn't that family's is `403`.
    After 20 wrong codes in a minute (in the header, or an invite code when
    joining), the same client gets `429` for the rest of that minute, so codes
    can't be guessed.

security:
  - FamilyCode: []

servers:
  - url: http://localhost:8000
    description: Backend run directly
  - url: http://localhost:8080/api
    description: Through the frontend container (docker compose)

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The backend is up and can reach the database
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /families:
    post:
      operationId: createFamily
      summary: Create a family
      description: >
        Open to anyone. This response is the only time the new family's invite code is shown
        to its creator; from then on, it's needed for everything about the family. There's no
        list of families: a family is found by its code (GET /family).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyCreate" }
      responses:
        "201":
          description: The new family, including its invite code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /families/join:
    post:
      operationId: joinFamily
      summary: Join a family with its invite code
      description: The code goes in the body, not the header. A wrong one counts toward the limit (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequest" }
      responses:
        "201":
          description: The new member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /family:
    get:
      operationId: getFamilyForCode
      summary: The family this code opens
      description: >
        How a client that has only a code (the frontend after a reload, the MCP server) finds
        its family. A code that opens no family is 403.
      responses:
        "200":
          description: The family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilySummary" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      operationId: getFamily
      summary: Get one family (without its invite code)
      description: >
        The code isn't repeated in responses: whoever asks already has it. Only POST /families
        (creating a family) and POST /families/{family_id}/invite-code (a new code) show one.
      responses:
        "200":
          description: The family
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilySummary" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/invite-code:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    post:
      operationId: newInviteCode
      summary: Replace the family's invite code with a new one
      description: >
        For when a code has been shared too widely. Anyone with the current code can do it. The
        old code stops working at once, for joining and for every request, so the new one has to
        be shared with the rest of the family. Members stay members. The Demo Family's code can't
        be changed (422): it's public by design.
      responses:
        "200":
          description: The family, with its new code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/members:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      operationId: listMembers
      summary: List a family's members
      responses:
        "200":
          description: Members, ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /members/{member_id}/steps:
    parameters:
      - name: member_id
        in: path
        required: true
        schema: { type: integer }
      - name: from
        in: query
        required: false
        description: First day to include (default 13 days before `to`)
        schema: { type: string, format: date }
      - name: to
        in: query
        required: false
        description: Last day to include (default today, Eastern)
        schema: { type: string, format: date }
    get:
      operationId: listMemberSteps
      summary: A member's daily step entries, newest first
      description: The code is the member's family's.
      responses:
        "200":
          description: Step entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StepEntry" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /steps:
    post:
      operationId: logSteps
      summary: Record daily step totals for a member
      description: |
        Used by manual entry in the app and by imports (later: Apple Shortcut,
        Fitbit sync, Garmin helper). Each entry is a day's total. Logging the same
        day again replaces the earlier total rather than adding to it.

        The code is the member's family's. Without one it's 401 straight away; the body
        is checked next (422), and then the member it names (404, or 403 for another
        family's member).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepsImport" }
      responses:
        "200":
          description: The saved entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StepEntry" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/leaderboards/weekly:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/AsOf"
    get:
      operationId: getWeeklyLeaderboard
      summary: Standings for the week (Monday–Sunday) containing `as_of`
      description: |
        Counts Monday through `as_of`. Changes compare with the same days of the
        previous week.
      responses:
        "200":
          description: The weekly leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/leaderboards/all-time:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
      - $ref: "#/components/parameters/AsOf"
    get:
      operationId: getAllTimeLeaderboard
      summary: Totals from the family's start date through `as_of`
      description: Changes compare with the totals at the end of the previous month.
      responses:
        "200":
          description: The all-time leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/messages:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      operationId: listMessages
      summary: Saved digests, newest first
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /families/{family_id}/digests:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    post:
      operationId: sendDigest
      summary: Build a digest, save it, and post it to Discord if configured
      description: |
        The scheduler calls this on Mondays (weekly, `as_of` = the Sunday that just
        ended) and on the 1st (monthly, `as_of` = the last day of the previous
        month). The app's "Send digest now" uses the default `as_of` of today.

        The Demo Family's digests are saved but never posted to Discord
        (`discord_status` is `not_configured`): anyone can send one, and the webhook
        belongs to a real family's channel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DigestRequest" }
      responses:
        "201":
          description: The saved message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/NoCode" }
        "403": { $ref: "#/components/responses/WrongCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  parameters:
    FamilyId:
      name: family_id
      in: path
      required: true
      schema: { type: integer }
    AsOf:
      name: as_of
      in: query
      required: false
      description: Last day to count, YYYY-MM-DD (default today, Eastern). A bad date is a 422.
      schema: { type: string, format: date }

  securitySchemes:
    FamilyCode:
      type: apiKey
      in: header
      name: X-Family-Code
      description: The family's invite code (not case-sensitive). The Demo Family's is DEMO.

  responses:
    NoCode:
      description: No X-Family-Code header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WrongCode:
      description: The code isn't this family's (for GET /family, it opens no family)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many wrong codes from this client in the last minute
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The family or member does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The request body or parameters are invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: {}

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    FamilySummary:
      type: object
      required: [id, name, start_date]
      properties:
        id: { type: integer }
        name: { type: string }
        start_date: { type: string, format: date }

    Family:
      allOf:
        - $ref: "#/components/schemas/FamilySummary"
        - type: object
          required: [invite_code]
          properties:
            invite_code: { type: string }

    FamilyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: No line breaks, tabs or other control characters (422); emoji are fine
        start_date:
          type: string
          format: date
          description: First day that counts (default today, Eastern)

    JoinRequest:
      type: object
      required: [invite_code, name]
      properties:
        invite_code: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: No line breaks, tabs or other control characters (422); emoji are fine

    Member:
      type: object
      required: [id, family_id, name]
      properties:
        id: { type: integer }
        family_id: { type: integer }
        name: { type: string }

    StepSource:
      type: string
      enum: [manual, import, seed, shortcut, fitbit, garmin]

    StepEntryIn:
      type: object
      required: [day, steps]
      properties:
        day:
          type: string
          format: date
          description: Must not be in the future (Eastern)
        steps: { type: integer, minimum: 0, maximum: 100000 }

    StepsImport:
      type: object
      required: [member_id, entries]
      properties:
        member_id: { type: integer }
        source:
          allOf: [{ $ref: "#/components/schemas/StepSource" }]
          default: manual
        entries:
          type: array
          minItems: 1
          maxItems: 366
          items: { $ref: "#/components/schemas/StepEntryIn" }

    StepEntry:
      type: object
      required: [member_id, day, steps, source]
      properties:
        member_id: { type: integer }
        day: { type: string, format: date }
        steps: { type: integer }
        source: { $ref: "#/components/schemas/StepSource" }

    Standing:
      type: object
      required: [member_id, name, steps, rank, medal]
      properties:
        member_id: { type: integer }
        name: { type: string }
        steps: { type: integer }
        rank:
          type: integer
          description: Ties share a rank (1, 1, 3)
        medal:
          type: [string, "null"]
          description: 🥇, 🥈 or 🥉 for ranks 1–3
        prev_rank:
          type: [integer, "null"]
          description: Rank in the comparison period; null if new
        step_change:
          type: [integer, "null"]
          description: Steps compared with the comparison period; null if new

    Callout:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [best_single_day, most_improved]
        text: { type: string }

    Leaderboard:
      type: object
      required: [kind, title, start, end, has_comparison, standings, callouts]
      properties:
        kind:
          type: string
          enum: [weekly, all_time]
        title: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        has_comparison:
          type: boolean
          description: False when there is no earlier period to compare with
        standings:
          type: array
          items: { $ref: "#/components/schemas/Standing" }
        callouts:
          type: array
          items: { $ref: "#/components/schemas/Callout" }

    DigestRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [weekly, monthly]
        as_of:
          type: string
          format: date
          description: Last day to count (default today, Eastern)

    Message:
      type: object
      required: [id, family_id, kind, text, created_at, discord_status]
      properties:
        id: { type: integer }
        family_id: { type: integer }
        kind:
          type: string
          enum: [weekly, monthly]
        text: { type: string }
        created_at: { type: string, format: date-time }
        discord_status:
          type: string
          enum: [not_configured, sent, failed]
          description: not_configured when no webhook is set, and always for the Demo Family
