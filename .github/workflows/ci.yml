name: CI

# Every push and every pull request into main runs all checks.
on:
  push:
  pull_request:
    branches: [main]

# A newer push to a branch cancels its older, still-running checks. Not on main: there a run may be
# deploying, and stopping it halfway could leave the server half updated, so main's runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SQLite is what tests and local runs use by default; Postgres is what docker compose and production use.
        include:
          - database: sqlite
            database_url: sqlite:///db.sqlite3
          - database: postgres
            database_url: postgres://stepboard:stepboard@localhost:5432/stepboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stepboard
          POSTGRES_PASSWORD: stepboard
          POSTGRES_DB: stepboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stepboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: ${{ matrix.database_url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (including the openapi.yaml contract tests)
        run: pytest
      - name: Production settings pass Django's deployment checks
        if: matrix.database == 'postgres'
        env:
          DJANGO_DEBUG: "0"
          DJANGO_HTTPS: "1"
          DJANGO_ALLOWED_HOSTS: stepboard.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://stepboard.example.com
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: docker compose config --quiet
      - name: Build the backend and frontend images
        run: docker compose build

  deploy:
    name: Deploy to production
    # Only for pushes to main (a merged pull request), and only once every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://159-89-228-242.sslip.io
    concurrency:
      group: deploy-production  # one deploy at a time
      cancel-in-progress: false
    env:
      SITE_URL: https://159-89-228-242.sslip.io
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's own key, so SSH refuses to connect if anything else answers at that address.
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # The server only lets this key run scripts/deploy.sh (docs/deployment.md), so no command is passed.
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST"

      - name: The live site answers
        run: |
          site_is_up() {
            curl -fsS --max-time 10 "$SITE_URL/api/health" > /dev/null &&
              curl -fsS --max-time 10 "$SITE_URL/api/families" | grep -q '"Demo Family"' &&
              curl -fsS --max-time 10 "$SITE_URL/" | grep -q '<title>Family Step Leaderboard</title>'
          }
          for attempt in $(seq 1 30); do
            if site_is_up; then
              echo "$SITE_URL is up: health, API and the React app all respond."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt of 30); waiting 10 seconds."
            sleep 10
          done
          echo "::error::$SITE_URL didn't respond correctly after the deploy."
          exit 1

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
