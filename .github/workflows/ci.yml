name: CI

# Every push and every pull request into main runs all checks.
on:
  push:
  pull_request:
    branches: [main]

# A newer push to a branch cancels its older, still-running checks. Not on main: there a run may be
# deploying, and stopping it halfway could leave the server half updated, so main's runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SQLite is what tests and local runs use by default; Postgres is what docker compose and production use.
        include:
          - database: sqlite
            database_url: sqlite:///db.sqlite3
          - database: postgres
            database_url: postgres://stepboard:stepboard@localhost:5432/stepboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stepboard
          POSTGRES_PASSWORD: stepboard
          POSTGRES_DB: stepboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stepboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: ${{ matrix.database_url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests (the HTTP API, workflows and the openapi.yaml contract)
        # Runs even if the unit tests failed, so one run shows the state of both.
        if: ${{ !cancelled() }}
        run: pytest tests/integration
      - name: Agent hook tests (agent-hooks/, run as Claude Code runs them)
        if: matrix.database == 'sqlite'
        run: python -m pytest ../agent-hooks/tests -p no:django
      - name: Ops redaction tests (ops/redact.py, which cleans server output before it's shared)
        if: matrix.database == 'sqlite'
        run: python -m pytest ../ops/tests -p no:django
      - name: Production settings pass Django's deployment checks
        if: matrix.database == 'postgres'
        env:
          DJANGO_DEBUG: "0"
          DJANGO_HTTPS: "1"
          DJANGO_ALLOWED_HOSTS: stepboard.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://stepboard.example.com
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as k; print(k())')"
          python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp-server/pyproject.toml
            backend/pyproject.toml
      - name: Install (the MCP server, plus the backend for the end-to-end tests)
        run: pip install -e ../backend -e ".[dev]"
      - name: Tests (the tools against a fake app, then against the real backend)
        env:
          STEPBOARD_REQUIRE_BACKEND: "1"  # fail, rather than skip, if the backend tests can't run
        run: pytest -rs

  security:
    name: Security scans
    # The scanners from security/findings.md. Each prints its whole report; only high and critical findings fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks reads the whole history, not just the latest commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scanners (in their own environment, apart from the project's)
        run: |
          python -m venv /tmp/sectools
          /tmp/sectools/bin/pip install --quiet bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit (Python code; fails on high severity)
        run: |
          paths="backend/stepboard backend/leaderboard mcp-server/stepboard_mcp agent-hooks"
          skip="agent-hooks/tests,backend/leaderboard/migrations"
          /tmp/sectools/bin/bandit -r $paths -x "$skip" --exit-zero
          /tmp/sectools/bin/bandit -r $paths -x "$skip" --severity-level high --quiet
      - name: pip-audit (the backend's and MCP server's dependencies, with dev tools; fails on any known vulnerability)
        if: ${{ !cancelled() }}
        # pip-audit's sources give no severity, so any finding fails. Each one so far was fixed by upgrading.
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install --quiet "./backend[dev]" "./mcp-server[dev]"
          /tmp/app/bin/pip freeze --exclude stepboard --exclude stepboard-mcp > /tmp/packages.txt
          /tmp/sectools/bin/pip-audit -r /tmp/packages.txt --no-deps --disable-pip --desc
      - name: npm audit (the frontend; fails on high or critical)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: gitleaks (secrets in any commit; fails on any)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' zricethezav/gitleaks:v8.30.1 git /repo --redact -v

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: docker compose config --quiet
      - name: Build the backend and frontend images
        run: docker compose build
      - name: Trivy (the images; fails on high or critical findings that have a fix)
        # Findings with no released fix, such as the backend's Debian packages, are reported but don't fail:
        # a rebuild can't remove them (security/findings.md). Once a fix is released, they fail until picked up.
        run: |
          trivy="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache aquasec/trivy:0.76.1"
          for image in $(docker compose config --images | grep -v '^postgres' | sort -u); do
            echo "::group::Trivy: $image (every finding)"
            $trivy image --scanners vuln --no-progress "$image"
            echo "::endgroup::"
            $trivy image --scanners vuln --no-progress --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  deploy:
    name: Deploy to production
    # Only for pushes to main (a merged pull request), and only once every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, mcp, security, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://159-89-228-242.sslip.io
    concurrency:
      group: deploy-production  # one deploy at a time
      cancel-in-progress: false
    env:
      SITE_URL: https://159-89-228-242.sslip.io
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's own key, so SSH refuses to connect if anything else answers at that address.
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # The server only lets this key run scripts/deploy.sh (docs/deployment.md), so no command is passed.
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST"

      - name: The live site answers
        run: |
          site_is_up() {
            curl -fsS --max-time 10 "$SITE_URL/api/health" > /dev/null &&
              curl -fsS --max-time 10 -H 'X-Family-Code: DEMO' "$SITE_URL/api/family" | grep -q '"Demo Family"' &&
              curl -fsS --max-time 10 "$SITE_URL/" | grep -q '<title>Family Step Leaderboard</title>'
          }
          for attempt in $(seq 1 30); do
            if site_is_up; then
              echo "$SITE_URL is up: health, API and the React app all respond."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt of 30); waiting 10 seconds."
            sleep 10
          done
          echo "::error::$SITE_URL didn't respond correctly after the deploy."
          exit 1

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
