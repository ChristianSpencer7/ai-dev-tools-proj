server {
    listen 80;

    # The API client calls /api/...; strip the prefix and pass it to the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # Pass on the HTTPS proxy's "this came in over HTTPS", or the backend's HTTPS redirect would loop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
