[project]
name = "stepboard"
version = "0.3.0"
description = "Family step leaderboard backend (Django)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.16",
    "apscheduler>=3.10,<4",  # run_scheduler: Monday and monthly digests; version 4 has a different API
    "dj-database-url>=3.0",
    "httpx>=0.27",  # the one request that posts a digest to a Discord webhook
    "psycopg[binary]>=3.2",  # Postgres driver, used when DATABASE_URL points at Postgres
    "python-dotenv>=1.0",
    "tzdata",  # zoneinfo data on Windows and slim images
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stepboard*", "leaderboard*"]
