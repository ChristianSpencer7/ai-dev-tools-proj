[project]
name = "stepboard"
version = "0.2.0"
description = "Family step leaderboard backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "tzdata",  # zoneinfo data on Windows and slim images
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
