[pytest]
DJANGO_SETTINGS_MODULE = stepboard.settings
testpaths = tests
# A misspelled marker on a test (@pytest.mark.integraton) is an error. A misspelled `-m` selects nothing
# without complaint, so prefer the folder form: pytest tests/unit, pytest tests/integration.
addopts = --strict-markers
markers =
    unit: one module tested on its own, called directly in Python (tests/unit)
    integration: through the HTTP API, across endpoints, as the app and reviewers use it (tests/integration)
