[project]
name = "stepboard"
version = "0.1.0"
description = "Family step leaderboard Discord bot"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "tzdata",  # zoneinfo data on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
