# docker compose up --build  →  the app at http://localhost:8080; the API and admin at http://localhost:8000
# Nothing to configure: every setting has a local default, and the demo family loads on first start.
# Discord is optional: put DISCORD_WEBHOOK_URL in a .env file next to this one.

# Every service's logs: at most 3 files of 10 MB, the oldest dropped first. Docker's default keeps everything
# (ops/diagnosis/README.md, finding 2).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by the backend and the scheduler: same image, same settings.
x-django: &django
  build: ./backend
  image: stepboard-backend
  restart: unless-stopped
  logging: *logging
  environment:
    DATABASE_URL: postgres://stepboard:stepboard@db:5432/stepboard
    DJANGO_DEBUG: "0"
    # For running locally only. A real deployment must set its own DJANGO_SECRET_KEY (task 11).
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-not-a-secret}
    # "backend" is how the frontend container and the health check reach it.
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    # Deployment only, behind an HTTPS proxy: HTTPS redirects, secure cookies, HSTS. Off on a laptop.
    DJANGO_HTTPS: ${DJANGO_HTTPS:-}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: stepboard
      POSTGRES_PASSWORD: stepboard
      POSTGRES_DB: stepboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepboard"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies migrations and seeds the demo family on start, then serves the API with gunicorn.
  backend:
    <<: *django
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Every 3 seconds while starting, so the stack (and a deploy) is ready as soon as the backend is; then every
    # 30 seconds. Every 3 seconds all the time made health checks most of the backend's log (ops/diagnosis/).
    # Unhealthy after 3 failures in a row: about 90 seconds.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 60s
      start_interval: 3s
      interval: 30s
      timeout: 5s
      retries: 3

  # Weekly digests on Mondays and monthly digests on the 1st, 8:00 AM Eastern.
  # Waits for a healthy backend, which means the migrations have run.
  scheduler:
    <<: *django
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      backend:
        condition: service_healthy

  # nginx serves the React app and passes /api/ to the backend.
  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
