# docker compose up  →  app at http://localhost:8080, API at http://localhost:8000/docs
# Demo data loads on first start. Discord is optional: set DISCORD_WEBHOOK_URL in .env.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepboard
      POSTGRES_PASSWORD: stepboard
      POSTGRES_DB: stepboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepboard"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://stepboard:stepboard@db:5432/stepboard
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20

  scheduler:
    build: ./backend
    command: ["python", "-m", "stepboard.scheduler"]
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
